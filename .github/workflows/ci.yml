name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # - name: Lint
      #   run: npm run lint

      - name: Type Check
        # Runs TypeScript compiler without emitting files to check for type errors
        run: npx tsc --noEmit

      - name: API type check
        run: npm run typecheck:api

      - name: Security regression tests
        run: node --loader ./tests/typescript-loader.mjs --test tests/security-boundaries.test.mjs tests/admin-security.test.mjs tests/seneca-private-cache.test.mjs

      - name: Publishing and sharing regression tests
        run: node --loader ./tests/typescript-loader.mjs --test tests/document-import.test.mjs tests/document-conversion.test.mjs tests/project-reading.test.mjs tests/project-seo.test.mjs tests/social-cards.test.mjs

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase/package-lock.json') }}

      - name: Install Firebase test tools
        run: npm ci --prefix firebase --ignore-scripts

      - name: Firebase authorization and sync integration tests
        run: npm run test:firebase

  build:
    name: Build Test
    runs-on: ubuntu-latest
    needs: quality # Only run build if quality checks pass
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        # This ensures the project builds successfully (catches Next.js build errors)
        run: npm run build

      - name: Validate public share previews
        run: npm run check:social
