name = "portfolio"
compatibility_date = "2024-12-01"

# This tells Cloudflare where your built static files are located
pages_build_output_dir = "out"

# The writing admin (functions/api/admin, functions/media).
#
# Drafts, revisions and uploaded images live in this private bucket; only
# published posts go to git. Secrets are set with `wrangler pages secret put`
# and never appear here: GITHUB_TOKEN, ACCESS_TEAM_DOMAIN, ACCESS_AUD,
# ADMIN_EMAIL. See docs/writing-admin.md.
[[r2_buckets]]
binding = "WRITING"
bucket_name = "portfolio-writing"

# Poll votes (functions/api/polls). The ID is a namespace's address, not a
# secret; the namespace was made with `wrangler kv namespace create POLLS`.
[[kv_namespaces]]
binding = "POLLS"
id = "e8acdae732924098a26fee37de60eb2f"

[vars]
GITHUB_REPO = "yulose9/Portfolio"
GITHUB_BRANCH = "master"
